name: PlxNative - DE Online-Trailer IPK (Branch-Version)
run-name: "DE-Trailer IPK aus ${{ github.ref_name }} (${{ github.sha }})"

# Manuell starten: Es wird der beim Start ausgewaehlte Branch gebaut.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipk:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Ausgewaehlten Branch des eigenen Forks laden
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Projektversion aus dem aktuellen Branch lesen
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("pkg/appinfo.json", encoding="utf-8"))["version"])')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "PlxNative-Version: $version"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $(git rev-parse --short HEAD)"
          echo "### PlxNative-IPK: v$version" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: $GITHUB_REF_NAME · Commit: $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Pruefen, ob die Online-Trailer-Integration im Branch vorhanden ist
        shell: bash
        run: |
          set -euo pipefail
          # Der alte Workflow hat den Trailer-Patch nur in einen separaten
          # v0.9.0-Checkout eingefuegt. Beim Branch-Build muss die Integration
          # dauerhaft im Rust-Quellcode stehen, sonst waere die IPK ohne Trailer.
          if ! rg -q --glob '*.rs' '192[.]168[.]0[.]2:8765|Trailer [(]Deutsch, online[)]' rust-modules; then
            echo "::error::In diesem Branch wurde keine Online-Trailer-Integration gefunden. Uebertrage zuerst den Trailer-Patch auf die aktuelle Quellcode-Version. Der alte v0.9.0-Patch ist nicht mit neuen Versionen kompatibel."
            exit 1
          fi
          git diff --check

      - name: Pinned Rust Compiler und webOS-Ziel installieren
        uses: ./.github/actions/rust-toolchain

      - name: LG webOS NDK einrichten
        id: ndk
        uses: ./.github/actions/webos-ndk

      - name: Native Debug-IPK kompilieren
        env:
          WEBOS_SDK: ${{ steps.ndk.outputs.sdk-dir }}
          RELEASE: '1'
          FLAVOR: debug
        shell: bash
        run: |
          set -euo pipefail
          make -j"$(nproc)"
          make ipk
          ls -lh pkg/com.beb.plxnative.debug_*_arm.ipk

      - name: IPK mit der Branch-Version als Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: plxnative-v${{ steps.version.outputs.version }}-de-trailer-debug-ipk
          path: pkg/com.beb.plxnative.debug_*_arm.ipk
          if-no-files-found: error
          retention-days: 7
